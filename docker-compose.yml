services:
  cv-pipeline:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models/yolov8n_food_best.pt:/app/models/yolov8n_food_best.pt
      - ./models/efficientnet_b0_food101_best.pt:/app/models/efficientnet_b0_food101_best.pt
      - ./models/idx_to_class.json:/app/models/idx_to_class.json
      - ./nutrition/usda.index:/app/nutrition/usda.index
      - ./nutrition/usda_records.json:/app/nutrition/usda_records.json
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - food-net
    restart: unless-stopped

  gradio-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - meals_db:/app/data
    environment:
      - API_URL=http://cv-pipeline:8000/analyze
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/meals.db
    networks:
      - food-net
    depends_on:
      - cv-pipeline
    restart: unless-stopped

networks:
  food-net:
    driver: bridge

volumes:
  meals_db: